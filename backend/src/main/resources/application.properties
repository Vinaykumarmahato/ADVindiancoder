# DATABASE CONFIGURATION (Optimized for Cross-Region Latency & Statement Caching)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/adv_full_stack_app?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=true}
