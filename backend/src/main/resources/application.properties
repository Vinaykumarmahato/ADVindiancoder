# ===================================================================
# CHANGE 3: HIKARICP HIGH-PERFORMANCE CONNECTION POOL
# (Drastically reduces cross-region TCP/TLS handshake latency & prevents idle drop)
# ===================================================================
# Maximum concurrent DB connections in pool
spring.datasource.hikari.maximum-pool-size=10
# Pre-warmed idle connections kept in memory to eliminate cold connection latency on login/register
spring.datasource.hikari.minimum-idle=5
# Maximum time (ms) a connection is allowed to sit idle before being eligible for retirement
spring.datasource.hikari.idle-timeout=300000
# Maximum lifetime (ms) of a connection in the pool (30 minutes)
spring.datasource.hikari.max-lifetime=1800000
# Maximum time (ms) that a client will wait for a connection from the pool before throwing exception
spring.datasource.hikari.connection-timeout=30000
# Sends ping (SELECT 1) every 60 seconds to prevent cross-region cloud firewalls from dropping connections
spring.datasource.hikari.keepalive-time=60000
# Leak detection threshold (ms) for logging connections held too long (60 seconds)
spring.datasource.hikari.leak-detection-threshold=60000
# Never crash the app on startup if remote cloud database is waking up or DNS resolves slowly
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=AdvIndianCoderHikariPool

# ===================================================================
# CHANGE 4: JPA & HIBERNATE PERFORMANCE & ROUND-TRIP OPTIMIZATIONS
# (Reduces unnecessary round-trips during login, register, and query execution)
# ===================================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
# Disabling open-in-view releases database connection immediately after transaction completes
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Batching Inserts & Updates to bundle multiple DB queries into single network packets
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Fetch size optimization (minimizes round-trips when fetching rows)
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# Prepared Statement and Query Optimization
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# ===================================================================
# CHANGE 2: SPRING BOOT ACTUATOR CONFIGURATION
# (Exposes lightweight health endpoint for keep-alive monitoring & uptime pings)
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

